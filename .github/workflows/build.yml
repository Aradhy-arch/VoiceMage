name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and inspect
        run: |
          ./gradlew compileJava || true
          for j in $(find ~/.gradle/caches/fabric-loom -name "*.jar"); do
            echo "Checking $j"
            javap -cp "$j" net.minecraft.client.gui.components.MultiLineEditBox 2>/dev/null && break || true
          done
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: voicemage
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar