name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and inspect
        run: |
          ./gradlew compileJava || true
          MC_JAR=$(find ~/.gradle/caches -name "*minecraft*.jar" | grep -v "sources" | head -n 1)
          echo "Found Minecraft JAR: $MC_JAR"
          javap -cp "$MC_JAR" net.minecraft.client.gui.components.MultiLineEditBox || true
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: voicemage
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar