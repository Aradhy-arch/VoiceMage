name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and inspect
        run: |
          ./gradlew compileJava || true
          javap -cp /home/runner/.gradle/caches/fabric-loom/26.2/minecraft-merged.jar 'net.minecraft.client.gui.components.MultiLineEditBox$Builder' || true
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: voicemage
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar